  - 隔离 venv 路径：C:/Users/Lenovo/.workbuddy-ai/binaries/python/envs/default
  - 环境变量需设 NO_PROXY=127.0.0.1,localhost，否则本机回环请求会被代理拦成 502。
  - >
    aiohttp 3.14.3 实测：AppRunner 签名里**没有**显式 access_log 参数，它经 **kwargs
    透传到 RequestHandler；而 RequestHandler 的默认值是 access_logger
    （logging.getLogger("aiohttp.access")），即**默认开启**，必须显式传 None 才关闭。
  - 非空转验证脚本写在系统 temp（spxw_probe_deadkey / wiring / lifecycle），不进仓库。
