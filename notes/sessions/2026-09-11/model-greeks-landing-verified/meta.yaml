notes:
  - >
    探针**必须**放在工程目录之外（C:/Users/Lenovo/.workbuddy-ai/tmp/）：
    工程内的 .py 会被 tools/selfcheck_core.iter_py_files() 扫到并让自检 [10]
    误报硬编码。归档进 artifacts/ 时改后缀 .py.txt（同样原因）。
  - >
    坑：ib_async 的 `ib.sleep()` 是**同步**方法（内部走 util.run），在 async 函数里
    调用会抛 `RuntimeError: This event loop is already running`。async 上下文里
    必须用 `await asyncio.sleep()`。第一版探针就踩了这个，在 [6] 步崩掉。
  - >
    "open orders request timed out" / "completed orders request timed out" 是
    IB 在 paper 环境下的常规告警，与本次验证无关。
  - >
    关键观测：modelGreeks 与 bid/ask/last 三档 greeks **四者并存且值不同**
    （model iv=0.12483/delta=0.43913；bid 0.12329/0.46919；ask 0.12629/0.46995；
    last 0.11728/0.46756）⇒ 证明 MODEL_OPTION 是独立的一条 tick 通道，
    不是同一份数据的拷贝。
  - >
    残留不确定：ib_async 的 GREEKS_TICK_MAP 把 tickType 13（实时模型）与
    83（延迟模型）合并到同一个 `modelGreeks` 属性，**无法从属性层区分**。
    故 TickRouter 把 source_tick_type 一律记为 13 —— 这是名义值。
    本次 marketDataType=1 倾向于是 13，属间接推断。
  - 本次未改任何生产代码；未重启项目服务（探针用独立 clientId=97）。
